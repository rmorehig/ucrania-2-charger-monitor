name: Keep monitor schedule active

on:
  schedule:
    - cron: '17 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-active:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Record monthly activity
        run: |
          date -u +%Y-%m > schedule-activity.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schedule-activity.txt
          git commit -m 'Keep charger monitor schedule active'
          git push
